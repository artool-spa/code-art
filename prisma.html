<title>Prisma</title>
<style>
  /* Fuentes variables auto-hospedadas (licencia OFL): sin peticiones a
     terceros (evita el aviso de privacidad de Safari en iOS), con respaldo
     en fonts.gstatic.com por si el archivo local no está disponible. */
  @font-face {
    font-family: "Cormorant Garamond";
    font-style: italic;
    font-weight: 300 400;
    font-display: swap;
    src: url("fonts/cormorant-garamond-italic.woff2") format("woff2"),
         url("https://fonts.gstatic.com/s/cormorantgaramond/v21/co3ZmX5slCNuHLi8bLeY9MK7whWMhyjYrEtImSqn7B6D.woff2") format("woff2");
  }
  @font-face {
    font-family: "Outfit";
    font-style: normal;
    font-weight: 300 500;
    font-display: swap;
    src: url("fonts/outfit.woff2") format("woff2"),
         url("https://fonts.gstatic.com/s/outfit/v15/QGYvz_MVcBeNP4NJtEtqUYLknw.woff2") format("woff2");
  }
</style>

<style>
  :root {
    --fondo: #0c0b12;
    --texto: #f4f3f6;     /* gray-100 */
    --etiqueta: #8a86a0;  /* slate-500 */
    --acento: #b288b9;    /* purple-500 · brand */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    min-height: 100%;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 3rem 1.5rem 4rem;
  }
  .sello {
    align-self: flex-start;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
  }
  .sello h1 {
    font-family: "Cormorant Garamond", "Times New Roman", serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.8rem, 3vw, 2.4rem);
    letter-spacing: 0.04em;
  }
  .sello p {
    margin-top: 0.25rem;
    font-size: 0.7rem;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--etiqueta);
  }
  figure.pieza {
    width: min(92vw, 1000px);
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }
  /* La escena es un solo canvas que baja hasta el wordmark; una máscara
     de dos capas deja ver el cuadro arriba y el recorte del logo abajo. */
  .escena {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3rem;
  }
  #gl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #17161e;
    cursor: grab;
    touch-action: none;
    mask-repeat: no-repeat;
    -webkit-mask-repeat: no-repeat;
    mask-position: left top, center bottom;
    -webkit-mask-position: left top, center bottom;
  }
  #gl.arrastrando { cursor: grabbing; }
  .espacio-imagen {
    width: 100%;
    aspect-ratio: 1.28;
    pointer-events: none;
  }
  .espacio-marca {
    width: min(52vw, 420px);
    aspect-ratio: 1995.2 / 458.63;
    pointer-events: none;
  }
  .espacio-marca svg {
    width: 100%;
    height: auto;
    display: block;
  }
  figcaption {
    font-size: 0.72rem;
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--etiqueta);
    text-align: center;
  }
  .aviso {
    color: var(--etiqueta);
    font-size: 0.85rem;
    text-align: center;
    padding: 3rem 1rem;
    display: none;
  }
</style>

<header class="sello">
  <h1>Prisma</h1>
  <p>icosaedro de vidrio · dispersión</p>
</header>

<figure class="pieza" role="img"
        aria-label="Icosaedro de vidrio sobre una superficie gris con grano; abajo, el logotipo de artool recortado sobre la continuación de la misma escena">
  <div class="escena">
    <canvas id="gl"></canvas>
    <div class="espacio-imagen" id="espacioImagen"></div>
    <div class="espacio-marca" id="espacioMarca" aria-hidden="true"></div>
  </div>
  <figcaption>Arrastra para girar el prisma</figcaption>
</figure>
<p class="aviso" id="aviso">Tu navegador no soporta WebGL, necesario para esta pieza.</p>

<script>
(() => {
  "use strict";

  const lienzo = document.getElementById("gl");
  const gl = lienzo.getContext("webgl", { antialias: true });
  if (!gl) {
    document.getElementById("aviso").style.display = "block";
    document.querySelector(".pieza").style.display = "none";
    return;
  }
  const reducirMovimiento = matchMedia("(prefers-reduced-motion: reduce)");

  // ——— Shaders ———
  const VS = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;

  const FS = `
    precision highp float;

    uniform vec2  uRes;
    uniform float uHImg;     // alto en px del cuadro superior: fija el encuadre
    uniform float uTiempo;
    uniform float uGiro;     // rotacion acumulada del prisma (mueve la caustica)
    uniform mat3  uRot;      // objeto -> mundo
    uniform vec3  uCentro;
    uniform float uEscala;
    uniform float uD;        // distancia de las caras al centro (radio inscrito)
    uniform vec3  uN[20];    // normales de las 20 caras (espacio objeto)

    const vec3 LUZ   = vec3(-0.30, 0.92, -0.72); // luz alta y por detrás
    const vec2 SDIR  = vec2(0.35, 0.94);         // la sombra cae hacia la cámara
    const vec3 SIGMA = vec3(0.50, 1.55, 0.42);   // absorción: tinte morado (deja pasar R y B)

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    // ——— Intersección rayo / poliedro convexo (espacio objeto) ———
    bool convexo(vec3 ro, vec3 rd, out float tN, out float tF, out vec3 nN, out vec3 nF) {
      tN = -1e5; tF = 1e5; nN = vec3(0.0); nF = vec3(0.0);
      for (int i = 0; i < 20; i++) {
        vec3 n = uN[i];
        float dn = dot(rd, n);
        float ho = uD - dot(ro, n);
        if (abs(dn) < 1e-6) { if (ho < 0.0) return false; continue; }
        float t = ho / dn;
        if (dn < 0.0) { if (t > tN) { tN = t; nN = n; } }
        else          { if (t < tF) { tF = t; nF = n; } }
        if (tN > tF) return false;
      }
      return true;
    }

    // ——— Entorno: sala oscura con una caja de luz ———
    vec3 env(vec3 rd) {
      vec3 col = mix(vec3(0.045, 0.045, 0.060), vec3(0.015, 0.015, 0.025),
                     smoothstep(-0.2, 0.7, rd.y));
      float haz = max(dot(rd, normalize(LUZ)), 0.0);
      col += vec3(1.25, 1.18, 1.30) * pow(haz, 70.0) * 3.2;   // fuente dura
      col += vec3(0.42, 0.38, 0.52) * pow(haz, 7.0) * 0.45;   // halo
      col += vec3(0.16, 0.12, 0.24)
           * pow(max(dot(rd, normalize(vec3(0.75, 0.25, 0.55))), 0.0), 10.0) * 0.5; // contraluz
      return col;
    }

    // ——— Suelo: superficie plana con grano fino + sombra + cáustica ———
    vec3 suelo(vec3 p) {
      float dist = length(p.xz);
      // grano en dos escalas, atenuado con la distancia para evitar moire
      float g1 = hash(floor(p.xz * 90.0)) - 0.5;
      float g2 = hash(floor(p.xz * 260.0) + 7.3) - 0.5;
      float grano = (g1 * 0.05 + g2 * 0.035) / (1.0 + dist * 0.6);
      float albedo = 0.31 + grano;
      vec3 base = albedo * vec3(0.96, 0.955, 1.06);   // gris pizarra frio

      float dif = normalize(LUZ).y;                   // plano: difusa constante
      // franjas diagonales de luz y sombra, como ventanas fuera de cuadro
      float franja = 1.0 - 0.62 * smoothstep(1.6, 2.6, dot(p.xz, vec2(-0.42, -0.91)));
      franja *= 1.0 - 0.45 * smoothstep(2.2, 3.4, dot(p.xz, vec2(0.94, -0.34)));
      vec3 col = base * (0.20 + 1.45 * dif * franja);

      // sombra del prisma: cono suave que se abre en la direccion opuesta a la luz
      vec2 sd = normalize(SDIR);
      float a = dot(p.xz, sd);                        // avance a lo largo de la sombra
      float perp = dot(p.xz, vec2(-sd.y, sd.x));
      float ancho = 0.30 + a * 0.42;
      float cono = smoothstep(ancho, ancho * 0.45, abs(perp))
                 * smoothstep(-0.25, 0.35, a) * (1.0 - smoothstep(2.2, 5.2, a));
      col *= 1.0 - 0.70 * cono;
      col *= 1.0 - 0.55 * exp(-dot(p.xz, p.xz) * 5.0); // sombra de contacto

      // caustica: charco morado + radios blancos que escapan del vidrio.
      // Todo el patron interno se mueve con el giro del prisma (uGiro):
      // el cono lo fija la luz, pero rayos e intensidades siguen a las facetas.
      vec2 rel = p.xz - sd * 0.30;
      float r = length(rel);
      float angRel = atan(rel.y, rel.x) - atan(sd.y, sd.x);
      float adelante = smoothstep(0.0, 0.25, cos(angRel));
      float charco = exp(-pow((r - 0.95) / 1.15, 2.0))
                   * exp(-pow(sin(angRel + 0.12 * sin(uGiro)) * r / 0.55, 2.0)) * adelante;
      col += vec3(0.58, 0.26, 0.66) * charco * (0.95 + 0.25 * sin(uGiro * 1.3));
      // segundo charco lejano: el morado alcanza la zona del wordmark
      float lejos = exp(-pow((r - 2.4) / 1.2, 2.0))
                  * exp(-pow(sin(angRel) * r / 0.9, 2.0)) * adelante;
      col += vec3(0.50, 0.22, 0.60) * lejos * 0.7;
      col += vec3(0.85, 0.55, 0.95) * exp(-r * r * 26.0)
           * (0.65 + 0.35 * sin(uGiro * 2.1 + 1.0)) * 0.9;   // brillo al pie del prisma

      for (int i = 0; i < 5; i++) {
        // cada rayo oscila alrededor de su posicion segun la rotacion,
        // con fase distinta: al girar, los destellos barren el suelo
        float off = -0.55 + 0.275 * float(i) + 0.30 * sin(uGiro + float(i) * 1.7);
        float d = abs(sin(angRel - off)) * r;
        float fuerza = 0.35 + 0.45 * (0.5 + 0.5 * sin(uGiro * 2.0 + float(i) * 2.4));
        float rayo = exp(-pow(d / (0.012 + 0.05 * r), 2.0))
                   * (1.0 - smoothstep(1.8, 5.0, r))
                   * smoothstep(0.0, 0.3, cos(angRel - off)) * adelante;
        col += vec3(0.97, 0.78, 1.05) * rayo * fuerza;   // rayos violeta
      }

      // fundido al entorno en la distancia
      return mix(col, vec3(0.02, 0.02, 0.03), smoothstep(5.0, 11.0, dist));
    }

    // ——— Refracción de un canal de color a través del prisma ———
    vec3 refraccion(vec3 pObj, vec3 dMundo, vec3 nMundo, float ior, out float L) {
      vec3 d = refract(dMundo, nMundo, 1.0 / ior);
      vec3 dd = normalize(d * uRot);            // v * M == transpose(M) * v : mundo -> objeto
      vec3 p = pObj + dd * 1e-3;
      L = 0.0;
      vec3 salida = vec3(0.0);
      for (int b = 0; b < 3; b++) {
        float tN, tF; vec3 nN, nF;
        convexo(p, dd, tN, tF, nN, nF);
        L += tF;
        p += dd * tF;
        vec3 rfr = refract(dd, -nF, ior);
        if (dot(rfr, rfr) > 0.0) { salida = rfr; break; }
        dd = reflect(dd, nF);                   // reflexion interna total
        p += dd * 1e-3;
      }
      if (dot(salida, salida) == 0.0) salida = dd;
      vec3 pw = uCentro + (uRot * p) * uEscala;
      vec3 dw = normalize(uRot * salida);
      L *= uEscala;
      if (dw.y < -0.02) {
        float t = -pw.y / dw.y;
        return suelo(pw + dw * t);
      }
      return env(dw);
    }

    void main() {
      // encuadre referido al cuadro superior: bajo el, la escena continua
      // hacia abajo y se ve a traves del recorte del wordmark
      vec2 fc = vec2(gl_FragCoord.x, gl_FragCoord.y - (uRes.y - uHImg));
      vec2 uv = (2.0 * fc - vec2(uRes.x, uHImg)) / uHImg;

      // camara elevada, como en la fotografia de referencia
      vec3 ro = vec3(0.0, 2.30, 3.20);
      vec3 ta = vec3(0.22, 0.36, 0.0);
      vec3 fw = normalize(ta - ro);
      vec3 ri = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
      vec3 up = cross(ri, fw);
      vec3 rd = normalize(fw * 2.3 + uv.x * ri + uv.y * up);

      // rayo en espacio objeto del prisma
      vec3 roO = ((ro - uCentro) * uRot) / uEscala;
      vec3 rdO = normalize(rd * uRot);
      float tN, tF; vec3 nN, nF;
      bool hay = convexo(roO, rdO, tN, tF, nN, nF);
      float tPrisma = tN * uEscala;
      float tSuelo = (rd.y < -1e-4) ? (-ro.y / rd.y) : 1e6;

      vec3 col;
      if (hay && tN > 0.0 && tPrisma < tSuelo) {
        vec3 pw = ro + rd * tPrisma;
        vec3 nw = normalize(uRot * nN);
        float cosi = clamp(dot(-rd, nw), 0.0, 1.0);
        float F = 0.05 + 0.95 * pow(1.0 - cosi, 5.0);

        vec3 rr = reflect(rd, nw);
        vec3 crefl = (rr.y < -0.02) ? suelo(pw + rr * (-pw.y / rr.y)) : env(rr);

        // dispersion: cada canal viaja con su propio indice de refraccion
        vec3 pObj = roO + rdO * tN;
        float Lr, Lg, Lb;
        float r = refraccion(pObj, rd, nw, 1.500, Lr).r * exp(-Lr * SIGMA.r);
        float g = refraccion(pObj, rd, nw, 1.530, Lg).g * exp(-Lg * SIGMA.g);
        float b = refraccion(pObj, rd, nw, 1.565, Lb).b * exp(-Lb * SIGMA.b);

        col = crefl * F + (1.0 - F) * vec3(r, g, b);
        col += vec3(1.0) * pow(max(dot(rr, normalize(LUZ)), 0.0), 90.0) * 1.6; // destello
      } else if (tSuelo < 1e5) {
        col = suelo(ro + rd * tSuelo);
      } else {
        col = env(rd);
      }

      // tono, viñeta y grano fotografico (la viñeta sigue el encuadre superior)
      col = pow(col * 1.25 / (col * 1.25 + 1.0), vec3(1.0 / 2.2));
      vec2 v = vec2(gl_FragCoord.x / uRes.x, fc.y / uHImg) - 0.5;
      col *= 1.0 - 0.42 * dot(v, v);   // suave, para no apagar los rayos bajo el wordmark
      col += (hash(gl_FragCoord.xy + fract(uTiempo) * 100.0) - 0.5) * 0.022;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compilar(tipo, src) {
    const s = gl.createShader(tipo);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compilar(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compilar(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  // quad a pantalla completa
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = (n) => gl.getUniformLocation(prog, n);

  // ——— Geometría del icosaedro (normales de cara = vértices del dodecaedro) ———
  const PHI = (1 + Math.sqrt(5)) / 2;
  const A = 1 / PHI;
  const normales = [];
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
    normales.push([sx, sy, sz]);
  }
  for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
    normales.push([0, s1 * A, s2 * PHI], [s1 * A, s2 * PHI, 0], [s2 * PHI, 0, s1 * A]);
  }
  const nPlano = [];
  for (const n of normales) {
    const m = Math.hypot(...n);
    nPlano.push(n[0] / m, n[1] / m, n[2] / m);
  }
  gl.uniform3fv(U("uN"), new Float32Array(nPlano));

  // radio inscrito para circunradio 1: max dot(vertice, normal)
  const verts = [];
  for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
    verts.push([0, s1, s2 * PHI], [s1, s2 * PHI, 0], [s2 * PHI, 0, s1]);
  }
  let D = 0;
  const n0 = nPlano.slice(0, 3);
  for (const v of verts) {
    const m = Math.hypot(...v);
    D = Math.max(D, (v[0] * n0[0] + v[1] * n0[1] + v[2] * n0[2]) / m);
  }
  gl.uniform1f(U("uD"), D);

  const ESCALA = 0.85;
  gl.uniform1f(U("uEscala"), ESCALA);
  gl.uniform3f(U("uCentro"), 0.0, D * ESCALA * 0.995, 0.0);

  // ——— Rotaciones (filas; se transpone al subir a WebGL) ———
  const mul = (a, b) => {
    const r = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
    }
    return r;
  };
  const rotY = (a) => [Math.cos(a), 0, Math.sin(a), 0, 1, 0, -Math.sin(a), 0, Math.cos(a)];
  const rotX = (a) => [1, 0, 0, 0, Math.cos(a), -Math.sin(a), 0, Math.sin(a), Math.cos(a)];

  // alinear una cara con el suelo: lleva la normal (1,1,1)/raiz3 a (0,-1,0)
  function alinearBase() {
    const u = [1 / Math.sqrt(3), 1 / Math.sqrt(3), 1 / Math.sqrt(3)];
    const v = [0, -1, 0];
    const eje = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
    const me = Math.hypot(...eje);
    const [x, y, z] = eje.map(c => c / me);
    const ang = Math.acos(u[0] * v[0] + u[1] * v[1] + u[2] * v[2]);
    const c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
    return [
      t * x * x + c,     t * x * y - s * z, t * x * z + s * y,
      t * x * y + s * z, t * y * y + c,     t * y * z - s * x,
      t * x * z - s * y, t * y * z + s * x, t * z * z + c,
    ];
  }
  const BASE = alinearBase();

  // ——— Interacción: arrastre con inercia y roce hacia el giro base ———
  const VEL_BASE = 0.10;   // rad/s del giro perezoso
  const ROCE = 0.9;        // constante de tiempo del roce (s)
  let yaw = 0.6, pitch = 0, girando = false;
  let velYaw = VEL_BASE, velPitch = 0;
  let px = 0, py = 0, tMov = 0;

  lienzo.addEventListener("pointerdown", (e) => {
    girando = true;
    velYaw = 0; velPitch = 0;
    lienzo.classList.add("arrastrando");
    lienzo.setPointerCapture(e.pointerId);
    px = e.clientX; py = e.clientY;
    tMov = reloj();
  });
  addEventListener("pointermove", (e) => {
    if (!girando) return;
    const ahora = reloj();
    const dtm = Math.max(1e-3, ahora - tMov);
    tMov = ahora;
    const dYaw = (e.clientX - px) * 0.006;
    const dPitch = (e.clientY - py) * 0.004;
    yaw += dYaw;
    pitch = Math.max(-0.5, Math.min(0.5, pitch + dPitch));
    // velocidad instantanea suavizada y acotada: es la inercia al soltar
    velYaw = Math.max(-7, Math.min(7, velYaw * 0.7 + (dYaw / dtm) * 0.3));
    velPitch = Math.max(-4, Math.min(4, velPitch * 0.7 + (dPitch / dtm) * 0.3));
    px = e.clientX; py = e.clientY;
    if (reducirMovimiento.matches) pintar(reloj());
  });
  addEventListener("pointerup", () => {
    girando = false;
    lienzo.classList.remove("arrastrando");
  });

  const reloj = () => performance.now() / 1000;

  // ——— Máscara de recorte: cuadro superior + silueta del wordmark abajo ———
  const espacioImagen = document.getElementById("espacioImagen");
  const espacioMarca = document.getElementById("espacioMarca");
  const LOGO_URI = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1995.2 458.63">'
    + document.getElementById("marcaMascara").outerHTML + "</svg>"
  );
  let hImgPx = 0;

  function redimensionar() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.round(lienzo.clientWidth * dpr);
    const h = Math.round(lienzo.clientHeight * dpr);
    if (lienzo.width !== w || lienzo.height !== h) {
      lienzo.width = w;
      lienzo.height = h;
      gl.viewport(0, 0, w, h);
    }
    hImgPx = espacioImagen.clientHeight * dpr;
    // dos capas que se suman: rectangulo de la imagen + logo como cutout
    const mascara = `linear-gradient(#000,#000), url("${LOGO_URI}")`;
    const tam = `100% ${espacioImagen.clientHeight}px, `
              + `${espacioMarca.clientWidth}px ${espacioMarca.clientHeight}px`;
    lienzo.style.maskImage = mascara;
    lienzo.style.webkitMaskImage = mascara;
    lienzo.style.maskSize = tam;
    lienzo.style.webkitMaskSize = tam;
  }

  const uRot = U("uRot"), uRes = U("uRes"), uTiempo = U("uTiempo"),
        uGiro = U("uGiro"), uHImg = U("uHImg");

  function pintar(t) {
    redimensionar();
    const R = mul(rotY(yaw), mul(rotX(pitch), BASE));
    // transponer: la matriz esta en filas y WebGL espera columnas
    gl.uniformMatrix3fv(uRot, false, new Float32Array([
      R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8],
    ]));
    gl.uniform2f(uRes, lienzo.width, lienzo.height);
    gl.uniform1f(uHImg, hImgPx);
    gl.uniform1f(uTiempo, t);
    gl.uniform1f(uGiro, yaw + pitch * 0.7);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  let anterior = reloj();
  function cuadro() {
    const t = reloj();
    const dt = Math.min(0.05, t - anterior);
    anterior = t;
    if (!girando) {
      // el roce lleva la velocidad de vuelta al giro base (y el cabeceo a cero)
      const roce = 1 - Math.exp(-dt / ROCE);
      velYaw += (VEL_BASE - velYaw) * roce;
      velPitch -= velPitch * roce;
      yaw += velYaw * dt;
      pitch = Math.max(-0.5, Math.min(0.5, pitch + velPitch * dt));
    }
    pintar(t);
    requestAnimationFrame(cuadro);
  }

  addEventListener("resize", () => { if (reducirMovimiento.matches) pintar(reloj()); });
  if (reducirMovimiento.matches) requestAnimationFrame(() => pintar(reloj()));
  else requestAnimationFrame(cuadro);
  reducirMovimiento.addEventListener("change", () => {
    if (!reducirMovimiento.matches) requestAnimationFrame(cuadro);
  });
})();
</script>
